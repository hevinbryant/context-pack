[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "context-pack"
version = "0.1.0"
description = "Pack your codebase intelligently for AI assistants — within a token budget"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "hevinbryant" }]
keywords = [
    "ai", "llm", "context", "codebase", "openai", "claude",
    "chatgpt", "token", "developer-tools", "cli",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
]
requires-python = ">=3.9"
dependencies = [
    "click>=8.1",
    "rich>=13.0",
    "pyperclip>=1.8",
]

[project.optional-dependencies]
fast-tokens = ["tiktoken>=0.6"]
dev = [
    "pytest>=7.4",
    "black>=24.0",
    "ruff>=0.4",
    "tiktoken>=0.6",
]

[project.scripts]
context-pack = "context_pack.cli:main"

[project.urls]
Homepage    = "https://github.com/hevinbryant/context-pack"
Repository  = "https://github.com/hevinbryant/context-pack"
"Bug Tracker" = "https://github.com/hevinbryant/context-pack/issues"

[tool.hatch.build.targets.wheel]
packages = ["context_pack"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.black]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts   = "-v --tb=short"
